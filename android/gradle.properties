org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
android.enableJetifier=true
# Disable the Gradle daemon on this machine: the client↔daemon loopback
# socket handshake has been failing on Windows (java.io.IOException:
# Unable to establish loopback connection), likely due to AV/firewall
# interference. Running without the daemon avoids that handshake.
org.gradle.daemon=false
